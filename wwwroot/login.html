<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng nhập · SaveMarkdown</title>
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <script>try{var t=JSON.parse(localStorage.getItem('savemd.theme'));if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="brand">
      <span class="brand-mark">
        <svg class="icon" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 13H8"/><path d="M16 17H8"/></svg>
      </span>
      SaveMarkdown
    </div>
    <h1>Đăng nhập</h1>
    <p class="subtitle">Nhập mật khẩu để xem tài liệu của bạn.</p>
    <form id="login-form" novalidate>
      <div>
        <label class="field-label" for="password">Mật khẩu</label>
        <div class="password-field">
          <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
          <button type="button" id="toggle-password" class="password-toggle" aria-label="Hiện mật khẩu" aria-pressed="false"></button>
        </div>
      </div>
      <label class="checkbox">
        <input id="remember" name="remember" type="checkbox">
        Ghi nhớ đăng nhập
      </label>
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button type="submit" id="submit" class="btn btn-primary">Vào</button>
    </form>
  </main>
  <script src="/login.js"></script>
</body>
</html>
