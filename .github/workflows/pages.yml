# Deploy bản web SaveMarkdown (đọc/ghi repo tài liệu qua GitHub API) lên GitHub Pages.
# Cần đặt Settings → Pages → Source = "GitHub Actions" trong repo này.
name: Deploy bản web lên GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'pages/**'
      - 'wwwroot/app.js'
      - 'wwwroot/styles.css'
      - 'wwwroot/icons/**'
      - 'AppPages/app.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: bash pages/build.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
